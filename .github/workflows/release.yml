name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run every check
        run: nix develop --command just check
      - name: Build the JetBrains plugin
        run: PLUGIN_VERSION="${GITHUB_REF_NAME#v}" nix develop --command just _build-jetbrains
      - name: Validate the stamped plugin.xml
        run: |
          jar="build/jetbrains/8th-light-themes-${GITHUB_REF_NAME#v}.jar"
          unzip -p "$jar" META-INF/plugin.xml | nix develop --command xmllint --noout -
          unzip -p "$jar" META-INF/plugin.xml | grep -F "<version>${GITHUB_REF_NAME#v}</version>"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/jetbrains/8th-light-themes-${GITHUB_REF_NAME#v}.jar" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
